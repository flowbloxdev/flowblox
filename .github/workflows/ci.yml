name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Windows build and unit tests
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Build applications and run unit tests
        run: ./scripts/Test-FlowBloxBuild.ps1
      - name: Check release version handling
        run: |
          ./scripts/tests/Test-ReleaseAutomation.ps1
          ./scripts/tests/Test-ReleaseTag.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/tests/Test-OnnxRuntimeSync.ps1
          if ($LASTEXITCODE -ne 0) { throw 'ONNX runtime synchronization checks failed.' }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-results
          path: TestResults/ci/*.trx
          if-no-files-found: warn
          retention-days: 14
